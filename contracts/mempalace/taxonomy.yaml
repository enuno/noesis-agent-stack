taxonomy_version: "1.0"
description: Wing/hall/room ownership mapping for MemPalace. Defines who may write to each room.

ownership_rules:
  principle: "Each room has a single primary writer. Cross-wing reads are allowed via tunnels; writes are not."
  enforcement: broker_mount + palace_acl

wings:
  - wing: hermes
    primary_owner: main-hermes
    write_access:
      - main-hermes
    read_access:
      - main-hermes
      - research-openclaw
      - subconscious-openclaw
      - coder
      - qa
    halls:
      - hall: decisions
        rooms:
          - room: routing-decisions
            owner: main-hermes
            description: Routing choices, delegation records, schedule changes.
          - room: approvals
            owner: main-hermes
            description: Approved plans, build intents, and release gates.
          - room: rejections
            owner: main-hermes
            description: Rejected proposals with reasoning.
      - hall: state
        rooms:
          - room: operator-preferences
            owner: main-hermes
            description: Operator interest profiles and preference history.
          - room: workflow-state
            owner: main-hermes
            description: Active workflow state and checkpoints.
      - hall: diary
        rooms:
          - room: main-hermes-diary
            owner: main-hermes
            description: End-of-session diary entries.

  - wing: broker
    primary_owner: broker
    write_access:
      - broker
    read_access:
      - main-hermes
      - broker
    halls:
      - hall: jobs
        rooms:
          - room: job-receipts
            owner: broker
            description: Normalized job completion receipts written by broker hook.
          - room: job-events
            owner: broker
            description: Structured event stream snapshots.
          - room: cancelled-jobs
            owner: broker
            description: Records of cancelled or timed-out jobs.
      - hall: workers
        rooms:
          - room: worker-registry
            owner: broker
            description: Registered workers and capability cards.
          - room: worker-health
            owner: broker
            description: Health snapshots and stale-worker flags.
      - hall: diary
        rooms:
          - room: broker-diary
            owner: broker
            description: Broker operational diary.

  - wing: research-vault
    primary_owner: research-openclaw
    write_access:
      - research-openclaw
    read_access:
      - research-openclaw
      - main-hermes
      - subconscious-openclaw
      - qa
    halls:
      - hall: knowledge
        rooms:
          - room: findings
            owner: research-openclaw
          - room: claims
            owner: research-openclaw
          - room: sources
            owner: research-openclaw
      - hall: output
        rooms:
          - room: dossiers
            owner: research-openclaw
          - room: operator-briefs
            owner: research-openclaw
          - room: handoff-candidates
            owner: research-openclaw
      - hall: state
        rooms:
          - room: queue
            owner: research-openclaw
          - room: config
            owner: research-openclaw
          - room: health
            owner: research-openclaw
          - room: runs
            owner: research-openclaw
      - hall: diary
        rooms:
          - room: research-openclaw-diary
            owner: research-openclaw

  - wing: subconscious-room
    primary_owner: subconscious-openclaw
    write_access:
      - subconscious-openclaw
    read_access:
      - subconscious-openclaw
      - main-hermes
    halls:
      - hall: walks
        rooms:
          - room: walk-notes
            owner: subconscious-openclaw
          - room: drift-from-research
            owner: subconscious-openclaw
          - room: pure-tangent
            owner: subconscious-openclaw
      - hall: signals
        rooms:
          - room: signal-events
            owner: subconscious-openclaw
          - room: signal-board
            owner: subconscious-openclaw
          - room: intent-drafts
            owner: subconscious-openclaw
      - hall: state
        rooms:
          - room: projects
            owner: subconscious-openclaw
          - room: feedback
            owner: subconscious-openclaw
          - room: inbox-from-research
            owner: subconscious-openclaw
            description: Read-only snapshots from research-vault written by broker hook on behalf of subconscious schedule.
          - room: lessons
            owner: subconscious-openclaw
          - room: fascinations
            owner: subconscious-openclaw
      - hall: diary
        rooms:
          - room: subconscious-openclaw-diary
            owner: subconscious-openclaw

  - wing: coder-jobs
    primary_owner: coder
    write_access:
      - coder
    read_access:
      - coder
      - main-hermes
      - qa
    halls:
      - hall: builds
        rooms:
          - room: active-builds
            owner: coder
          - room: build-artifacts
            owner: coder
          - room: migration-notes
            owner: coder
      - hall: context
        rooms:
          - room: implementation-decisions
            owner: coder
          - room: tech-constraints
            owner: coder
      - hall: diary
        rooms:
          - room: coder-diary
            owner: coder

  - wing: qa-reports
    primary_owner: qa
    write_access:
      - qa
    read_access:
      - qa
      - main-hermes
      - coder
    halls:
      - hall: audits
        rooms:
          - room: test-results
            owner: qa
          - room: audit-reports
            owner: qa
          - room: release-gates
            owner: qa
      - hall: evidence
        rooms:
          - room: claim-verification-history
            owner: qa
          - room: contradiction-flags
            owner: qa
      - hall: diary
        rooms:
          - room: qa-diary
            owner: qa

tunnels:
  description: "Cross-wing connections that allow read access to shared room names without write permission."
  active:
    - room_name: operator-preferences
      connects:
        - wing: hermes
        - wing: research-vault
      note: "Research may read operator preferences; never write."
    - room_name: inbox-from-research
      connects:
        - wing: research-vault
        - wing: subconscious-room
      note: "Subconscious reads research snapshots via tunnel."
    - room_name: handoff-candidates
      connects:
        - wing: research-vault
        - wing: hermes
      note: "Hermes reads handoff candidates for approval."
    - room_name: intent-drafts
      connects:
        - wing: subconscious-room
        - wing: hermes
      note: "Hermes reads intent drafts for routing decisions."
