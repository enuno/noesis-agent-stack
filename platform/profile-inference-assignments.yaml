# platform/profile-inference-assignments.yaml
# Strategic profile -> inference-lane assignment matrix for the Noesis stack.
#
# Scope: observe_only design artifact. This file does NOT change live dispatch,
# does NOT activate any provider lane, and does NOT weaken any prior policy
# status. It records, per profile, the policy-valid strategic lane/model
# assignment derived from repository sources only (no ~/.hermes reads beyond
# the already-extracted non-secret reconciliation evidence, no provider calls).
#
# Status vocabulary (restricted by design):
#   observe_only                  - compliant selection exists; evaluation only.
#   blocked_missing_configuration - no canonical lane/model/policy binding.
#   proposed                      - strategically appropriate lane needs formal
#                                   activation requirements first.
# Never: approved / active / enforced / production.
#
# Lane status facts this matrix preserves (platform/inference-routing.yaml):
#   KIMI_CODE            approved  (pinned kimi-k2.7-code, max r2,
#                                    types supervisor|orchestrator|worker|coder|
#                                    qa|security|ops|reflective,
#                                    data public|internal)
#   PERPLEXITY_API       proposed  (evidence-only lane, research-typed,
#                                    data public|internal_redacted, max r1)
#   NOUS_PORTAL          proposed  (not approved; no canonical pin)
#   CLAUDE_CODE_PRO      proposed  (not approved; bridge unbound)
#   CHATGPT_PRO          blocked_missing_configuration
#   VENICE_PRO           blocked_missing_configuration
#   OPENROUTER_FALLBACK  disabled  (never primary; never fallback; max r0)
#
# Note on inventory: profiles/noesis-roster.yaml carries 17 noesis-* IDs
# (the roster header still says "16-agent fleet"; noesis-orchestrator was added
# later). The 22-profile union = 17 roster IDs + 5 additional platform agent
# IDs (main-hermes, research-openclaw, subconscious-openclaw, coder, qa);
# noesis-orchestrator appears in both registries and is counted once.

version: "2026-10-04.1"
mode: observe_only
source_of_truth:
  routing_policy: platform/inference-routing.yaml
  model_catalog: shared/models.yaml
  model_aliases: shared/model-aliases.yaml
  provider_policy: shared/provider-policies.yaml
  reconciliation: platform/runtime-reconciliation.yaml

profiles:

  # ── Supervisors / control plane ──────────────────────────────────────────

  - profile_id: noesis-core
    profile_type: supervisor
    purpose: "Noesis supervisor and router (Hermes-Core): intake, domain/risk classification, narrowest-mandate assignment, approval-gate enforcement; never executes domain work."
    authority_level: approval_gated
    risk_ceiling: r2
    allowed_data_classes: [public, internal]
    prohibited_data_classes: [confidential, restricted, secret]
    allowed_task_classes: [supervisor_control_plane]
    tool_policy:
      allowed: [memory, session_search, file, web, clarify, todo, delegation, cronjob, skills]
      denied: [terminal, code_execution, treasury_read, treasury_propose_action, artifact_publish_external, wallet]
    inference_strategy:
      status: observe_only
      primary:
        lane: KIMI_CODE
        model_ref: kimi-k2.7-code
        parameters: {temperature: 0.2, max_tokens: 12000, timeout_seconds: 120}
        selection_rationale: >
          Observed runtime and repo declaration are aligned on KIMI_CODE /
          kimi-k2.7-code; KIMI_CODE is the only approved lane and permits the
          supervisor type with the supervisor_control_plane task class.
          Long-context synthesis quality is rated from the analogous canonical
          catalog profile reasoning_primary (temperature 0.2 envelope); the
          kimi model has no canonical parameter block, so these are proposed
          bounds pending lane eval, not measured properties.
      critic:
        required: true
        lane: null
        model_ref: null
        trigger_conditions: [novel_or_material_planning, ambiguous_risk_classification, externally_grounded_claims]
      fallback:
        enabled: false
        ordered_candidates: []
        constraints: {preserve_data_class: true, preserve_risk_tier: true, preserve_tool_scope: true, preserve_approval_gates: true}
      prohibited_lanes: [OPENROUTER_FALLBACK, PERPLEXITY_API]
      dispatch_conditions:
        - "observe_only: record decision, never alter live dispatch"
        - "no_secret_payload check before dispatch"
        - "risk_gate: r2+ requires approval gate and independent-family review before execution routing"
        - "structured decision records for dispatch judgments"
    validation:
      required_evals: [IR-001, IR-002, IR-011, IR-012, IR-013, PIA-001, PIA-002, PIA-004, PIA-009, PIA-012]
      required_gates: [human_approval_manifest, structured_output, no_secret_egress]
      success_metrics: [validator_strict_pass, zero_secret_findings, structured_decision_record_validity]
    rollout:
      stage: observe_only
      activation_requirements:
        - routing_matrix_review
        - independent_provider_review
        - qa_or_policy_gate
        - evals/inference-routing.eval.yaml green
        - explicit_human_approval before any live dispatch change
    evidence:
      profile_sources: [profiles/noesis-roster.yaml, platform/runtime-reconciliation.yaml]
      policy_sources: [platform/inference-routing.yaml, shared/models.yaml, platform/risk-tiers.yaml]
      unresolved_gaps:
        - "Cross-family critic lane is not selectable (CLAUDE_CODE_PRO is proposed, CHATGPT_PRO is blocked_missing_configuration); r2+ review currently has no approved independent family."

  - profile_id: noesis-orchestrator
    profile_type: orchestrator
    purpose: "Control-plane orchestrator: task-contract lifecycle, dispatch control, dependency gating, approval gates, synthesis; holds no terminal or execution authority."
    authority_level: planning
    risk_ceiling: r2
    allowed_data_classes: [public, internal]
    prohibited_data_classes: [confidential, restricted, secret]
    allowed_task_classes: [supervisor_control_plane]
    tool_policy:
      allowed: [memory, file, todo, clarify, delegation, session_search, skills]
      denied: [terminal, code_execution, treasury_read, treasury_propose_action, artifact_publish_external, wallet]
    inference_strategy:
      status: observe_only
      primary:
        lane: KIMI_CODE
        model_ref: kimi-k2.7-code
        parameters: {temperature: 0.1, max_tokens: 12000, timeout_seconds: 120}
        selection_rationale: >
          Reconciliation shows drift (observed KIMI_CODE vs repo-declared
          CLAUDE_CODE_PRO claude-sonnet-5, which is proposed, not approved).
          Strategic assignment adopts neither side as policy: the only approved
          lane KIMI_CODE is assigned observe_only while the drift is resolved.
          Lower temperature proposed for deterministic dispatch judgment;
          analogous canonical envelope from reasoning_primary, bounded pending
          lane eval. Dispatch-gate evaluation is deterministic policy code, not
          model judgment (see profiles/model-profiles.yaml defaults).
      critic:
        required: true
        lane: null
        model_ref: null
        trigger_conditions: [ambiguous_risk_classification, novel_dispatch_pattern, material_synthesis]
      fallback:
        enabled: false
        ordered_candidates: []
        constraints: {preserve_data_class: true, preserve_risk_tier: true, preserve_tool_scope: true, preserve_approval_gates: true}
      prohibited_lanes: [OPENROUTER_FALLBACK, PERPLEXITY_API]
      dispatch_conditions:
        - "observe_only: record, never block or mutate live dispatch"
        - "risk ceiling r2; r3 contracts are planned and routed to privileged executors behind human approval, never executed here"
        - "structured_output_required for synthesis artifacts"
    validation:
      required_evals: [IR-011, IR-012, ORCH-001, ORCH-002, ORCH-004, ORCH-006, PIA-001, PIA-002, PIA-009, PIA-012]
      required_gates: [approval_gate_enforcement, dependency_gating, handoff_evidence, circuit_breaker]
      success_metrics: [validator_strict_pass, orchestrator_test_suite_pass, zero_secret_findings]
    rollout:
      stage: observe_only
      activation_requirements:
        - resolve KIMI-vs-CLAUDE_CODE_PRO reconciliation drift via routing_matrix_review
        - independent_provider_review
        - qa_or_policy_gate
        - explicit_human_approval before any live dispatch change
    evidence:
      profile_sources: [profiles/noesis-roster.yaml, platform/orchestrator.yaml, platform/runtime-reconciliation.yaml]
      policy_sources: [platform/inference-routing.yaml, profiles/model-profiles.yaml, shared/GUARDRAILS.global.yaml]
      unresolved_gaps:
        - "Repo-declared CLAUDE_CODE_PRO route is proposed, not approved; drift must not be adopted without human review."
        - "No approved cross-family critic exists for r2+ synthesis review."

  - profile_id: noesis-steward
    profile_type: orchestrator
    purpose: "Chief of staff: daily triage, prioritization, deadline tracking, status digests; delegates planning to Cartographer."
    authority_level: planning
    risk_ceiling: r2
    allowed_data_classes: [public, internal]
    prohibited_data_classes: [confidential, restricted, secret]
    allowed_task_classes: [supervisor_control_plane]
    tool_policy:
      allowed: [memory, file, todo, session_search, web, clarify, delegation, skills]
      denied: [terminal, code_execution, treasury_read, treasury_propose_action, artifact_publish_external, wallet]
    inference_strategy:
      status: observe_only
      primary:
        lane: KIMI_CODE
        model_ref: kimi-k2.7-code
        parameters: {temperature: 0.2, max_tokens: 12000, timeout_seconds: 120}
        selection_rationale: >
          Aligned observed/repo KIMI route; fast triage is the dominant
          workload and KIMI_CODE is approved for the orchestrator type.
          Parameters proposed from the reasoning_primary analog; low-stakes
          digests may later move to a cheap_router lane once NOUS_PORTAL or a
          local lane graduates from blocked_missing_configuration.
      critic:
        required: true
        lane: null
        model_ref: null
        trigger_conditions: [conflicting_priorities, material_deadline_risk]
      fallback:
        enabled: false
        ordered_candidates: []
        constraints: {preserve_data_class: true, preserve_risk_tier: true, preserve_tool_scope: true, preserve_approval_gates: true}
      prohibited_lanes: [OPENROUTER_FALLBACK, PERPLEXITY_API]
      dispatch_conditions:
        - "observe_only"
        - "structured digest output with schema validation"
        - "no external posting authority"
    validation:
      required_evals: [IR-001, IR-002, PIA-001, PIA-002, PIA-009]
      required_gates: [structured_output, schema_validation]
      success_metrics: [validator_strict_pass, digest_schema_validity]
    rollout:
      stage: observe_only
      activation_requirements: [routing_matrix_review, evals/inference-routing.eval.yaml green, explicit_human_approval]
    evidence:
      profile_sources: [profiles/noesis-roster.yaml, platform/runtime-reconciliation.yaml]
      policy_sources: [platform/inference-routing.yaml]
      unresolved_gaps: ["No approved cheap_router lane (NOUS_PORTAL proposed) for high-volume triage cost optimization."]

  - profile_id: noesis-cartographer
    profile_type: orchestrator
    purpose: "Project decomposition: goals to phased task graphs, dependency maps, risk registers, ADRs; never executes."
    authority_level: planning
    risk_ceiling: r2
    allowed_data_classes: [public, internal]
    prohibited_data_classes: [confidential, restricted, secret]
    allowed_task_classes: [supervisor_control_plane]
    tool_policy:
      allowed: [memory, file, web, todo, clarify, delegation, skills, session_search]
