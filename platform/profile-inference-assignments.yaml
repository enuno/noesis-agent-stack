    inference_strategy:
      status: observe_only
      primary:
        lane: KIMI_CODE
        model_ref: kimi-k2.7-code
        parameters: {temperature: 0.2, max_tokens: 12000, timeout_seconds: 120}
        selection_rationale: >
          Repo-declared OpenRouter/claude-sonnet-5 route is blocked in
          reconciliation (OpenRouter is disabled fleet-wide); the aligned
          observed KIMI runtime is the only policy-compliant approved lane for
          long-context decomposition. Structured plan output required.
      critic:
        required: true
        lane: null
        model_ref: null
        trigger_conditions: [multi_phase_plan, cross_profile_dependencies, risk_register_material]
      fallback:
        enabled: false
        ordered_candidates: []
        constraints: {preserve_data_class: true, preserve_risk_tier: true, preserve_tool_scope: true, preserve_approval_gates: true}
      prohibited_lanes: [OPENROUTER_FALLBACK, PERPLEXITY_API]
      dispatch_conditions:
        - "observe_only"
        - "structured plan artifacts (task graph, ADR) with schema validation"
        - "OpenRouter-declared repo route must remain blocked until catalog contradiction is resolved and human review occurs"
    validation:
      required_evals: [IR-008, IR-014, PIA-001, PIA-002, PIA-009]
      required_gates: [structured_output, schema_validation, quarantine_on_invalid_output]
      success_metrics: [validator_strict_pass, plan_artifact_schema_validity]
    rollout:
      stage: observe_only
      activation_requirements:
        - resolve_openrouter_catalog_contradiction
        - routing_matrix_review
        - explicit_human_approval
    evidence:
      profile_sources: [profiles/noesis-roster.yaml, platform/runtime-reconciliation.yaml]
      policy_sources: [platform/inference-routing.yaml]
      unresolved_gaps: ["Repo-declared OpenRouter primary must stay blocked; claude-sonnet-5 has no canonical lane binding."]

  - profile_id: noesis-architect
    profile_type: orchestrator
    purpose: "Agent/orchestration designer: profiles, prompts, memory systems, MCP/ACP/A2A integration design; never implements infra directly."
    authority_level: planning
    risk_ceiling: r2
    allowed_data_classes: [public, internal]
    prohibited_data_classes: [confidential, restricted, secret]
    allowed_task_classes: [supervisor_control_plane]
    tool_policy:
      allowed: [web, file, memory, session_search, skills, todo]
      denied: [terminal, code_execution, treasury_read, treasury_propose_action, artifact_publish_external, wallet]
    inference_strategy:
      status: observe_only
      primary:
        lane: KIMI_CODE
        model_ref: kimi-k2.7-code
        parameters: {temperature: 0.2, max_tokens: 12000, timeout_seconds: 120}
        selection_rationale: >
          Observed KIMI route is the only approved option; repo-declared
          OpenRouter/claude-sonnet-5 stays blocked. Design artifacts require
          structured output; prompt-robustness cross-check needs a second
          family that is not yet selectable.
      critic:
        required: true
        lane: null
        model_ref: null
        trigger_conditions: [prompt_robustness_review, novel_integration_design]
      fallback:
        enabled: false
        ordered_candidates: []
        constraints: {preserve_data_class: true, preserve_risk_tier: true, preserve_tool_scope: true, preserve_approval_gates: true}
      prohibited_lanes: [OPENROUTER_FALLBACK, PERPLEXITY_API]
      dispatch_conditions:
        - "observe_only"
        - "structured design docs; alias changes require routing review (IR-015)"
    validation:
      required_evals: [IR-008, IR-014, IR-015, PIA-001, PIA-002, PIA-009]
      required_gates: [structured_output, routing_review_for_alias_changes]
      success_metrics: [validator_strict_pass]
    rollout:
      stage: observe_only
      activation_requirements: [resolve_openrouter_catalog_contradiction, routing_matrix_review, explicit_human_approval]
    evidence:
      profile_sources: [profiles/noesis-roster.yaml, platform/runtime-reconciliation.yaml]
      policy_sources: [platform/inference-routing.yaml, shared/model-aliases.yaml]
      unresolved_gaps: ["Cross-family design critic unavailable (CHATGPT_PRO blocked_missing_configuration)."]

  - profile_id: main-hermes
    profile_type: supervisor
    purpose: "Platform supervisor: sole broker-job submitter and persistent reasoning layer; approves/rejects workflow gates; never executes shell directly."
    authority_level: approval_gated
    risk_ceiling: r2
    allowed_data_classes: [public, internal]
    prohibited_data_classes: [confidential, restricted, secret]
    allowed_task_classes: [supervisor_control_plane]
    tool_policy:
      allowed: [broker_submit_job, broker_get_job, broker_list_artifacts, route_handoff, read_workspace, write_main_state, github_fetch, schema_validate]
      denied: [terminal, code_execution, treasury_read, treasury_propose_action, artifact_publish_external, wallet]
    inference_strategy:
      status: observe_only
      primary:
        lane: KIMI_CODE
        model_ref: kimi-k2.7-code
        parameters: {temperature: 0.2, max_tokens: 12000, timeout_seconds: 120}
        selection_rationale: >
          Runtime was not observed by the reconciliation pass; repo declares
          reasoning_primary / claude-sonnet-4-5 (a canonical catalog profile
          name, but CLAUDE_CODE_PRO as a lane is proposed, not approved
          and no approved lane carries that catalog binding). KIMI_CODE is the
          only approved lane for the supervisor type and is assigned
          observe_only strictly as an evaluable baseline, not as an adoption
          of any drifted runtime.
      critic:
        required: true
        lane: null
        model_ref: null
        trigger_conditions: [material_routing_decision, escalation_path, contradictory_worker_evidence]
      fallback:
        enabled: false
        ordered_candidates: []
        constraints: {preserve_data_class: true, preserve_risk_tier: true, preserve_tool_scope: true, preserve_approval_gates: true}
      prohibited_lanes: [OPENROUTER_FALLBACK, PERPLEXITY_API]
      dispatch_conditions:
        - "observe_only"
        - "routing decisions recorded as structured decision records"
        - "broker job submission is the only external side effect and stays supervisor-exclusive"
    validation:
      required_evals: [HERMES-001, HERMES-002, HERMES-003, HERMES-004, HERMES-005, IR-014, PIA-001, PIA-002, PIA-009, PIA-012]
      required_gates: [human_approval_manifest, broker_authority_exclusive, palace_context_query]
      success_metrics: [validator_strict_pass, platform_eval_hermes_routing_pass]
    rollout:
      stage: observe_only
      activation_requirements:
        - "observe and reconcile actual runtime route before any assignment becomes binding"
        - independent_provider_review
        - explicit_human_approval
    evidence:
      profile_sources: [platform/orchestrator.yaml, platform/runtime-reconciliation.yaml]
      policy_sources: [platform/inference-routing.yaml, shared/models.yaml, shared/tools.yaml]
      unresolved_gaps:
        - "Runtime route unobserved; repo declaration (claude-sonnet-4-5) has no approved lane binding."
        - "Escalation model (reasoning_strong/OpenAI) has no approved lane."

  # ── Coder / ops executors ────────────────────────────────────────────────

  - profile_id: noesis-forge
    profile_type: coder
    purpose: "Software engineering executor: code, IaC, CI/CD; never deploys to production or merges unreviewed."
    authority_level: bounded_execution
    risk_ceiling: r2
    allowed_data_classes: [public, internal]
    prohibited_data_classes: [confidential, restricted, secret]
    allowed_task_classes: [implementation_planning]
    tool_policy:
      allowed: [terminal, file, web, memory, session_search, skills, todo, delegation, code_execution]
      denied: [treasury_read, treasury_propose_action, artifact_publish_external, wallet, production_deploy]
    inference_strategy:
      status: observe_only
      primary:
        lane: KIMI_CODE
        model_ref: kimi-k2.7-code
        parameters: {temperature: 0.1, max_tokens: 16000, timeout_seconds: 300}
        selection_rationale: >
          Aligned observed/repo KIMI route; KIMI_CODE is approved for coder
          type with implementation_planning and is the fleet's code lane.
          Bounded workspace, patch-quality evals, and independent review are
          mandatory gates. Parameters proposed from the code_primary charter
          analog (low temperature, bounded output); job timeout bounded
          separately by orchestrator config.
      critic:
        required: true
        lane: null
        model_ref: null
        trigger_conditions: [always_for_r2, security_relevant_change, novel_repository]
      fallback:
        enabled: false
        ordered_candidates: []
        constraints: {preserve_data_class: true, preserve_risk_tier: true, preserve_tool_scope: true, preserve_approval_gates: true}
      prohibited_lanes: [OPENROUTER_FALLBACK, PERPLEXITY_API]
      dispatch_conditions:
        - "observe_only"
        - "r2+ work requires independent provider-family review (noesis-sentinel) and QA validation before success"
        - "implementation and reviewer lanes must differ in provider family once a second family is selectable"
        - "rollback plan required for r2"
    validation:
      required_evals: [IR-006, IR-011, ORCH-007, PIA-001, PIA-002, PIA-005, PIA-006, PIA-009]
      required_gates: [independent_provider_review, qa_validation, rollback_plan_for_r2]
      success_metrics: [patch_quality_eval, test_construction_pass_rate, validator_strict_pass]
    rollout:
      stage: observe_only
      activation_requirements:
        - claude_code_bridge_binding (for cross-family review) or other approved independent-family reviewer lane
        - routing_matrix_review
        - explicit_human_approval
    evidence:
      profile_sources: [profiles/noesis-roster.yaml, platform/runtime-reconciliation.yaml]
      policy_sources: [platform/inference-routing.yaml, platform/risk-tiers.yaml]
      unresolved_gaps:
        - "Independent reviewer family unavailable: CLAUDE_CODE_PRO bridge binding not yet established (lane proposed)."

  - profile_id: coder
    profile_type: coder
    purpose: "Platform builder lane: receives approved handoffs from Hermes, writes artifacts to coder-jobs workspace; cannot self-start."
    authority_level: bounded_execution
    risk_ceiling: r2
    allowed_data_classes: [public, internal]
    prohibited_data_classes: [confidential, restricted, secret]
    allowed_task_classes: [implementation_planning]
    tool_policy:
      allowed: [file, terminal, code_execution, unit_test, schema_validate, git_write, artifact_publish_internal, github_fetch]
      denied: [treasury_read, treasury_propose_action, artifact_publish_external, wallet, broker_submit_job, route_handoff]
