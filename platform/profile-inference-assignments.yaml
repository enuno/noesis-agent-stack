  - profile_id: noesis-substrate
    profile_type: ops
    purpose: "Infrastructure/DevOps engineer: containers, K8s, cloud/edge, networking; no production changes without approval."
    authority_level: bounded_execution
    risk_ceiling: r2
    allowed_data_classes: [public, internal]
    prohibited_data_classes: [confidential, restricted, secret]
    allowed_task_classes: [ops_planning]
    tool_policy:
      allowed: [terminal, file, web, memory, session_search, skills, todo, delegation]
      denied: [code_execution, treasury_read, treasury_propose_action, artifact_publish_external, wallet, production_mutation_without_manifest]
    inference_strategy:
