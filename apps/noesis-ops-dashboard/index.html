<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noesis Ops Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --hbg:#0b1416; --hpanel:#0f1c1f; --hpanel2:#142629; --hraise:#182d31;
  --hline:rgba(242,232,213,.14); --hline2:rgba(242,232,213,.30);
  --htext:#f2e8d3; --hdim:rgba(242,232,213,.55); --hfaint:rgba(242,232,213,.32);
  --hacc:#e6ad4a; --hacc2:#8a6a24; --hacctint:rgba(230,173,74,.12);
  --herr:#ff563c; --hok:#5fae90; --hinfo:#78a9c4;
}
[data-theme="poseidon"]{
  --hbg:#071420; --hpanel:#0b1e2c; --hpanel2:#10293a; --hraise:#153347;
  --hline:rgba(226,244,247,.14); --hline2:rgba(226,244,247,.30);
  --htext:#e4f2f4; --hdim:rgba(228,242,244,.55); --hfaint:rgba(228,242,244,.32);
  --hacc:#5ad4bd; --hacc2:#256f63; --hacctint:rgba(90,212,189,.12);
  --herr:#ff6b57; --hok:#5ad4bd; --hinfo:#7fb4dd;
}
[data-theme="mono"]{
  --hbg:#101010; --hpanel:#171717; --hpanel2:#1f1f1f; --hraise:#282828;
  --hline:rgba(255,255,255,.14); --hline2:rgba(255,255,255,.30);
  --htext:#ededed; --hdim:rgba(255,255,255,.55); --hfaint:rgba(255,255,255,.32);
  --hacc:#f2f2f2; --hacc2:#8a8a8a; --hacctint:rgba(255,255,255,.10);
  --herr:#c9c9c9; --hok:#a8a8a8; --hinfo:#b5b5b5;
}
html,body{margin:0;padding:0;height:100%;background:var(--hbg);color:var(--htext);font-family:"Archivo",system-ui,sans-serif;font-size:14px}
a{color:var(--hacc);text-decoration:none}
a:hover{color:var(--htext)}
::selection{background:rgba(230,173,74,.28)}
:focus-visible{outline:2px solid var(--hacc);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(242,232,213,.16)}
@keyframes hpulse{0%{box-shadow:0 0 0 0 currentColor;opacity:1}70%{box-shadow:0 0 0 7px transparent;opacity:.85}100%{box-shadow:0 0 0 0 transparent;opacity:1}}
@keyframes hspark{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
@keyframes hcardin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes hlinein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes hshimmer{0%{background-position:-220px 0}100%{background-position:320px 0}}
@keyframes hblink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes hfadein{from{opacity:0}to{opacity:1}}
button{font-family:inherit}
</style>
</head>
<body>
<div id="app" data-theme="hermes" style="height:100vh;display:grid;grid-template-rows:auto auto 1fr;background:var(--hbg);color:var(--htext);overflow:hidden">

  <header style="display:flex;align-items:stretch;height:54px;border-bottom:2px solid var(--hline2);background:var(--hpanel)">
    <div id="brand" style="display:flex;align-items:center;gap:12px;padding:0 16px;border-right:2px solid var(--hline2);flex:none">
      <svg width="20" height="24" viewBox="0 0 20 24" fill="none" stroke="var(--hacc)" stroke-width="1.4" stroke-linecap="round"><path d="M10 4v17"></path><path d="M10 4.6c-2.2 0-3.4 1.6-3.4 3s1.2 2.6 3.4 2.6 3.4 1.2 3.4 2.7-1.2 3-3.4 3-3.4-1.5-3.4-3"></path><path d="M6 3.4 2 1.3v4.2zM14 3.4 18 1.3v4.2z"></path><circle cx="10" cy="2.2" r="1.5"></circle></svg>
      <div style="display:flex;flex-direction:column;line-height:1.15">
        <span style="font-size:12px;font-weight:800;letter-spacing:.14em">NOESIS OPS</span>
        <span id="brandSub" style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--hfaint);letter-spacing:.04em">noesis.agent fleet</span>
      </div>
    </div>

    <div id="fleetChips" style="display:flex;align-items:center;gap:8px;padding:0 12px;border-right:1px solid var(--hline);min-width:0;overflow:hidden;flex-shrink:1"></div>

    <div id="meta" style="display:flex;align-items:center;gap:18px;padding:0 16px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--hdim);border-right:1px solid var(--hline);flex-shrink:1;min-width:0;overflow:hidden;white-space:nowrap">
      <span>UPTIME <span id="uptime" style="color:var(--htext)">0d 00:00</span></span>
      <span id="clock"></span>
    </div>

    <div style="flex:1;min-width:0"></div>

    <div style="display:flex;align-items:center;gap:6px;padding:0 12px;border-left:1px solid var(--hline);flex:none">
      <button data-theme-btn="hermes" title="Theme · Hermes gold" style="width:30px;height:30px;display:grid;place-items:center;background:transparent;border:1px solid var(--hline);border-radius:2px;cursor:pointer;color:var(--htext)"><span style="width:11px;height:11px;border-radius:99px;background:#e6ad4a;border:1px solid rgba(0,0,0,.35)"></span></button>
      <button data-theme-btn="poseidon" title="Theme · Poseidon seafoam" style="width:30px;height:30px;display:grid;place-items:center;background:transparent;border:1px solid var(--hline);border-radius:2px;cursor:pointer;color:var(--htext)"><span style="width:11px;height:11px;border-radius:99px;background:#5ad4bd;border:1px solid rgba(0,0,0,.35)"></span></button>
      <button data-theme-btn="mono" title="Theme · Mono" style="width:30px;height:30px;display:grid;place-items:center;background:transparent;border:1px solid var(--hline);border-radius:2px;cursor:pointer;color:var(--htext)"><span style="width:11px;height:11px;border-radius:99px;background:#e8e8e8;border:1px solid rgba(0,0,0,.35)"></span></button>
      <button id="approvalsBell" title="Approval queue" style="position:relative;width:34px;height:30px;display:grid;place-items:center;background:transparent;border:1px solid var(--hline);border-radius:2px;cursor:pointer;color:var(--htext);margin-left:6px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
        <span id="approvalBadge" style="display:none;position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 3px;display:grid;place-items:center;background:var(--hacc);color:#14100a;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;border-radius:99px"></span>
      </button>
    </div>
  </header>

  <div id="approvalBanner" style="display:none;align-items:center;gap:14px;padding:9px 16px;background:var(--hacctint);border-bottom:2px solid var(--hacc);overflow:hidden">
    <span style="display:flex;align-items:center;gap:8px;flex:none;white-space:nowrap;font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--hacc)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg>
      <span id="approvalHeadline"></span>
    </span>
    <span id="topApproval" style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--hdim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1 1 0;min-width:0"></span>
    <button id="reviewBtn" style="flex:none;white-space:nowrap;padding:6px 14px;background:var(--hacc);color:#14100a;border:0;border-radius:2px;font-family:Archivo,sans-serif;font-size:12px;font-weight:800;letter-spacing:.1em;cursor:pointer">REVIEW QUEUE</button>
  </div>

  <div id="grid" style="display:grid;grid-template-columns:252px minmax(0,1fr) 396px;min-height:0">

    <aside style="border-right:2px solid var(--hline2);background:var(--hpanel);display:flex;flex-direction:column;min-height:0;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--hline)">
        <span id="railLabel" style="font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--hdim)">AGENT ROSTER</span>
        <button id="toggleRail" title="Collapse rail" style="width:24px;height:24px;display:grid;place-items:center;background:transparent;border:1px solid var(--hline);border-radius:2px;color:var(--hdim);cursor:pointer">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h16"></path></svg>
        </button>
      </div>
      <div id="roster" style="overflow-y:auto;flex:1"></div>
      <div id="railFoot" style="padding:10px 12px;border-top:1px solid var(--hline);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--hfaint);line-height:1.6">
        <div>ans registry · 6 resolved</div>
        <div>mcp 14 · acp 3 · a2a 2</div>
      </div>
    </aside>

    <main style="display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--hbg)">
      <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--hline);background:var(--hpanel)">
        <div style="display:flex;border:1px solid var(--hline);border-radius:2px;overflow:hidden">
          <button id="viewStream" style="padding:5px 12px;background:var(--hacc);color:#14100a;border:0;font-family:Archivo,sans-serif;font-size:12px;font-weight:800;letter-spacing:.1em;cursor:pointer">ACTIVITY STREAM</button>
          <button id="viewKanban" style="padding:5px 12px;background:transparent;color:var(--hdim);border:0;border-left:1px solid var(--hline);font-family:Archivo,sans-serif;font-size:12px;font-weight:800;letter-spacing:.1em;cursor:pointer">KANBAN BOARD</button>
        </div>
        <span id="filterLabel" style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--hdim)"></span>
        <div style="flex:1"></div>
        <button id="openPalette" style="display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--hpanel2);border:1px solid var(--hline);border-radius:2px;color:var(--hdim);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <span>Command</span>
          <span style="padding:1px 5px;border:1px solid var(--hline);border-radius:2px;font-size:11px">⌘K</span>
        </button>
      </div>

      <div id="mainBody" style="flex:1;overflow-y:auto;padding:16px;min-height:0"></div>
    </main>

    <section id="pane" style="display:flex;flex-direction:column;border-left:2px solid var(--hline2);background:var(--hpanel);min-height:0">
      <div style="display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-bottom:1px solid var(--hline)">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
            <span id="paneDot" style="width:7px;height:7px;border-radius:99px;background:var(--hdim)"></span>
            <span id="paneAgent" style="font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600"></span>
            <span id="paneStatus" style="font-size:11px;letter-spacing:.1em;color:var(--hdim);font-weight:800"></span>
          </div>
          <div id="paneTitle" style="font-size:12px;color:var(--hdim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
        </div>
        <button id="closePane" title="Dismiss" style="width:24px;height:24px;flex:none;display:grid;place-items:center;background:transparent;border:1px solid var(--hline);border-radius:2px;color:var(--hdim);cursor:pointer">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>
      <div style="display:flex;gap:14px;padding:8px 14px;border-bottom:1px solid var(--hline);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--hfaint)">
        <span>stdout</span><span style="color:var(--hacc)">tool calls</span><span id="logCount"></span>
      </div>
      <div id="logs" style="flex:1;overflow-y:auto;padding:10px 14px 16px;background:var(--hbg);font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.65;min-height:0"></div>
    </section>
  </div>

  <div id="palette" style="display:none;position:fixed;inset:0;background:rgba(4,9,10,.72);z-index:80;align-items:flex-start;justify-content:center;padding-top:12vh;animation:hfadein .14s ease-out both">
    <div id="paletteBox" style="width:min(620px,92vw);background:var(--hpanel);border:1px solid var(--hline2);border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,.65);overflow:hidden">
      <div style="display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--hline)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--hacc)" stroke-width="1.8" stroke-linecap="round"><path d="m9 18 6-6-6-6"></path></svg>
        <input id="paletteInput" placeholder="Run a command, jump to an agent, filter the fleet…" style="flex:1;background:transparent;border:0;outline:none;color:var(--htext);font-family:'IBM Plex Mono',monospace;font-size:14px">
        <span style="padding:2px 6px;border:1px solid var(--hline);border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--hfaint)">ESC</span>
      </div>
      <div id="paletteCommands" style="max-height:46vh;overflow-y:auto;padding:6px 0"></div>
    </div>
  </div>

  <div id="approvalsModal" style="display:none;position:fixed;inset:0;background:rgba(4,9,10,.72);z-index:90;align-items:center;justify-content:center;padding:24px;animation:hfadein .14s ease-out both">
    <div style="width:min(760px,94vw);max-height:86vh;display:flex;flex-direction:column;background:var(--hpanel);border:1px solid var(--hacc);border-radius:12px;box-shadow:0 28px 72px rgba(0,0,0,.7);overflow:hidden">
      <div style="display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:2px solid var(--hacc);background:var(--hacctint)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--hacc)" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg>
        <span style="font-size:18px;font-weight:800;letter-spacing:.02em">Approval queue</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--hdim)">least-privilege · human-in-the-loop</span>
        <div style="flex:1"></div>
        <button id="closeApprovals" style="width:26px;height:26px;display:grid;place-items:center;background:transparent;border:1px solid var(--hline2);border-radius:2px;color:var(--htext);cursor:pointer">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>
      <div id="approvalList" style="overflow-y:auto;padding:14px 20px 20px;display:flex;flex-direction:column;gap:12px"></div>
    </div>
  </div>
</div>

<script>

/* =========================================================================

  {id:'a4', agent:'lucidus.noesis.agent', project:'YWCA MISSOULA', threshold:'PROD PUBLISH', waiting:'44m', title:'Publish ywcaofmissoula.com to production + DNS cutover', detail:'Build 2f81c0 · 43 pages, 2 redirects changed · TTL drop to 60s for 20 min\nRollback: previous build retained 7 days', scope:'scope: deploy.publish, dns.update'}

  ['info','[lucidus] patching token to accent-700, rebuilding']
];
const COLORS = {running:'--hacc', approval:'--hacc', error:'--herr', done:'--hok', idle:'--hfaint', queued:'--hinfo'};

  {agent:'hermes', project:'NOESIS AGENT STACK', title:'Delegate transcript reindex to a fresh worker — shard 04, 1,412 records', status:'RUNNING', state:'running', pct:6, chips:[['ACP','plan.revise'],['A2A','worker.spawn']]},

function stamp(off){
  const d = new Date(Date.now() + (off||0)*1000);
  return d.toTimeString().slice(0,8);
}
function fmt(sec){
  if(sec < 60) return sec + 's';
  const m = Math.floor(sec/60), s = sec % 60;
  if(m < 60) return m + 'm ' + String(s).padStart(2,'0') + 's';
  return Math.floor(m/60) + 'h ' + String(m%60).padStart(2,'0') + 'm';
}
function cvar(state){ return 'var(' + (COLORS[state] || '--hdim') + ')'; }
function chip(c){
  const kind = c[0];
  const col = kind === 'MCP' ? 'var(--hacc)' : kind === 'A2A' ? 'var(--hinfo)' : 'var(--hok)';
  return {kind, name:c[1], color:col, border:'var(--hline)'};
}
function spark(id){
  let seed = id.split('').reduce((x,c) => x + c.charCodeAt(0), 0);
  const pts = [];
  for(let i=0;i<14;i++){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; pts.push((i*4.2).toFixed(1) + ',' + (2 + (seed % 1000)/1000 * 13).toFixed(1)); }
  return pts.join(' ');
}

function logColor(kind){
  return kind === 'mcp' ? 'var(--hacc)' : kind === 'a2a' ? 'var(--hinfo)' : kind === 'acp' ? 'var(--hok)' : kind === 'warn' ? '#e8c27a' : kind === 'ok' ? 'var(--hok)' : kind === 'dim' ? 'var(--hdim)' : 'var(--htext)';
}
function pushLog(line){
  const src = line || LOGPOOL[S.logi % LOGPOOL.length];
  S.logs = S.logs.concat([{kind:src[0], text:src[1], t:stamp(0)}]).slice(-90);
  S.logi++;
  if(S.paneOpen) renderPane();
}
function arrive(){
  S.skeleton = true;
  render();
  setTimeout(() => {
    const src = ARRIVALS[ai++ % ARRIVALS.length];
    const t = Object.assign({}, src, {id:'n'+Date.now(), t:0, fresh:true});
    S.skeleton = false;
    S.tasks = [t].concat(S.tasks).slice(0,12);
    render();
  }, 2400);
}
function resolve(a, ok){
  S.approvals = S.approvals.filter(x => x.id !== a.id);
  pushLog([ok ? 'ok' : 'warn', (ok ? '[operator] APPROVED ' : '[operator] DENIED ') + a.title + ' · ' + a.scope]);
  render();
}
function openPalette(){ S.paletteOpen = true; S.query = ''; render(); $('paletteInput').focus(); }
function closePalette(){ S.paletteOpen = false; render(); }

function buildCommands(){
  const s = S;
  const cmdList = [
    {group:'VIEW', color:'var(--hdim)', label:'Switch to Kanban board', hint:'⇧B', run:() => act({view:'kanban'})},
    {group:'VIEW', color:'var(--hdim)', label:'Switch to activity stream', hint:'⇧S', run:() => act({view:'stream'})},
    {group:'APPROVE', color:'var(--hacc)', label:'Open approval queue', hint:'⇧A', run:() => { S.approvalsOpen = true; render(); }},
    {group:'THEME', color:'var(--hdim)', label:'Theme · Hermes gold', hint:'', run:() => act({theme:'hermes'})},
    {group:'THEME', color:'var(--hdim)', label:'Theme · Poseidon seafoam', hint:'', run:() => act({theme:'poseidon'})},
    {group:'THEME', color:'var(--hdim)', label:'Theme · Mono', hint:'', run:() => act({theme:'mono'})},
    {group:'FLEET', color:'var(--hdim)', label:'Clear filter · show all agents', hint:'', run:() => act({selected:'all'})}
  ].concat(AGENTS.map(a => ({group:'AGENT', color:'var(--hinfo)', label:'Focus ' + a.short + a.suffix, hint:a.role.toLowerCase(), run:() => act({selected:a.id})})))
   .concat(s.tasks.slice(0,6).map(t => ({group:'TASK', color:'var(--hfaint)', label:t.title, hint:t.agent, run:() => act({selectedTask:t.id, paneOpen:true})})));
  const q = s.query.trim().toLowerCase();
  return q ? cmdList.filter(c => (c.label + ' ' + c.group + ' ' + c.hint).toLowerCase().includes(q)) : cmdList;
}

  $('paletteCommands').innerHTML = commands.map(c =>
    '<button data-cmd style="width:100%;display:flex;align-items:center;gap:12px;padding:9px 16px;background:transparent;border:0;color:var(--htext);cursor:pointer;text-align:left;font-family:Archivo,sans-serif">' +
      '<span style="font-size:11px;font-weight:800;letter-spacing:.1em;color:' + c.color + ';min-width:74px">' + c.group + '</span>' +
      '<span style="flex:1;font-size:14px">' + c.label + '</span>' +
      '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:var(--hfaint)">' + c.hint + '</span>' +
    '</button>'
  ).join('') +
  (commands.length === 0 ? '<div style="padding:22px 16px;font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--hfaint)">No command matches that.</div>' : '');
  $('paletteCommands').querySelectorAll('[data-cmd]').forEach((el, i) => {
    el.addEventListener('click', () => commands[i].run());
  });
}
function renderApprovals(){
  $('approvalsModal').style.display = 'flex';
  const s = S;
  $('approvalList').innerHTML = s.approvals.map(a =>
    '<div style="border:1px solid var(--hline2);border-left:3px solid var(--hacc);border-radius:8px;padding:14px 16px;background:var(--hpanel2)">' +
      '<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">' +
        '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;font-weight:600">' + a.agent + '</span>' +
        '<span style="padding:2px 7px;border:1px solid var(--hline);border-radius:2px;font-size:11px;letter-spacing:.08em;color:var(--hdim)">' + a.project + '</span>' +
        '<span style="padding:2px 7px;background:var(--hacctint);color:var(--hacc);border-radius:2px;font-size:11px;font-weight:800;letter-spacing:.1em">' + a.threshold + '</span>' +
        '<div style="flex:1"></div>' +
        '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:var(--hfaint)">waiting ' + a.waiting + '</span>' +
      '</div>' +
      '<div style="font-size:15.75px;font-weight:600;line-height:1.35;margin-bottom:6px;text-wrap:pretty">' + a.title + '</div>' +
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--hdim);line-height:1.6;margin-bottom:11px;white-space:pre-wrap">' + a.detail + '</div>' +
      '<div style="display:flex;align-items:center;gap:8px">' +
        '<button data-approve data-id="' + a.id + '" style="padding:6px 14px;background:var(--hacc);color:#14100a;border:0;border-radius:2px;font-family:Archivo,sans-serif;font-size:12px;font-weight:800;letter-spacing:.1em;cursor:pointer">APPROVE</button>' +
        '<button data-deny data-id="' + a.id + '" style="padding:6px 14px;background:transparent;color:var(--herr);border:1px solid var(--herr);border-radius:2px;font-family:Archivo,sans-serif;font-size:12px;font-weight:800;letter-spacing:.1em;cursor:pointer">DENY</button>' +
        '<div style="flex:1"></div>' +
        '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:var(--hfaint)">' + a.scope + '</span>' +
      '</div>' +
    '</div>'
  ).join('') +
  (s.approvals.length === 0 ? '<div style="padding:40px 4px;display:flex;flex-direction:column;gap:8px;align-items:flex-start"><div style="font-size:18px;font-weight:600">Queue clear</div><div style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--hdim)">Every pending action has been acknowledged. Hermes will escalate again when an agent crosses an autonomy threshold.</div></div>' : '');
  $('approvalList').querySelectorAll('[data-approve]').forEach(el => {
    el.addEventListener('click', () => resolve(S.approvals.find(x => x.id === el.dataset.id), true));
  });
  $('approvalList').querySelectorAll('[data-deny]').forEach(el => {
    el.addEventListener('click', () => resolve(S.approvals.find(x => x.id === el.dataset.id), false));
  });
}

/* --- wire events --- */
document.querySelectorAll('[data-theme-btn]').forEach(btn => {
  btn.addEventListener('click', () => { S.theme = btn.dataset.themeBtn; render(); });
});
$('toggleRail').addEventListener('click', () => { S.railOpen = !S.railOpen; render(); });
$('viewStream').addEventListener('click', () => { S.view = 'stream'; render(); });
$('viewKanban').addEventListener('click', () => { S.view = 'kanban'; render(); });
$('openPalette').addEventListener('click', openPalette);
$('closePane').addEventListener('click', () => { S.paneOpen = false; render(); });
$('approvalsBell').addEventListener('click', () => { S.approvalsOpen = true; render(); });
$('closeApprovals').addEventListener('click', () => { S.approvalsOpen = false; render(); });
$('reviewBtn').addEventListener('click', () => { S.approvalsOpen = true; render(); });
$('palette').addEventListener('click', e => { if(e.target === $('palette')) closePalette(); });
$('approvalsModal').addEventListener('click', e => { if(e.target === $('approvalsModal')) { S.approvalsOpen = false; render(); } });
$('paletteInput').addEventListener('input', e => { S.query = e.target.value; renderPalette(); });

/* roster selection via delegation */
$('roster').addEventListener('click', e => {
  const btn = e.target.closest('[data-select]');
  if(btn) S.selected = btn.dataset.select === 'all' ? 'all' : btn.dataset.select;
  render();
});

/* keyboard */
window.addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPalette(); }
  if(e.key === 'Escape'){ if(S.paletteOpen) closePalette(); else if(S.approvalsOpen){ S.approvalsOpen = false; render(); } }
});

/* resize */
function onResize(){
  const n = window.innerWidth < 1180;
  if(n !== S.narrow){ S.narrow = n; if(n) S.paneOpen = false; else S.paneOpen = true; render(); }
}
window.addEventListener('resize', onResize);

/* init logs */
S.logs = LOGPOOL.slice(0,11).map((l,i) => ({kind:l[0], text:l[1], t:stamp(-((11-i)*7))}));

/* timers */
setInterval(() => {
  S.tick++;
  S.tasks = S.tasks.map(t => {
    if(t.state === 'running') return Object.assign({}, t, {t:t.t+1, pct: Math.min(99, t.pct + (t.pct < 96 ? 0.35 : 0))});
    if(t.state === 'approval' || t.state === 'error') return Object.assign({}, t, {t:t.t+1});
    return t;
  });
  render();
}, 1000);
setInterval(() => pushLog(), 1600);
setInterval(() => arrive(), 21000);
setTimeout(() => arrive(), 9000);

onResize();
render();
</script>
</body>
</html>
