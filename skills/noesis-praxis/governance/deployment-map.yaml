# discovery_status values:
#   discovered         - independently loadable under this name right now
#   shadowed           - deployed, byte-verified, zero drift, but a
#                        pre-existing skill of the same name in this profile
#                        wins; this copy is not currently loadable by name
#   not_installed      - disposition C (blocked); nothing deployed

