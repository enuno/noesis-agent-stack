# discovery path, plus actual discovery status as last verified.
#
# Runtime root checked: /home/elvis/.hermes/skills (noesis-praxis / default
# Hermes profile). Deployment mechanism: `rsync -a --delete` of
# skills/noesis-praxis/skills/<name>/ to ~/.hermes/skills/noesis-praxis/<name>/
# from the commit recorded in provenance/manifest.yaml -- a deployed snapshot
# of a reviewed commit, not a live link to the working tree, per
# governance/MAINTENANCE.md's runtime-first-exception guidance ("keep the
# runtime from writing the canonical repository where feasible").
#
# Verified via skills_list(category='noesis-praxis') and
# `tests/validate_skill_tree.py --runtime-root ~/.hermes/skills`
# (0 drift errors against the files that ARE independently discoverable).
