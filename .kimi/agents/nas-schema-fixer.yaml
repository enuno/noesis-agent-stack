version: 1
agent:
  name: nas-schema-fixer
  description: Fixes schema mismatches in the Noesis Agent Stack main-hermes state layer. Corrects cost caps, SprintState fields, and BrokerJob required fields.
  model: inherit
  system_prompt_path: ./nas-schema-fixer.md
  tools:
    - "kimi_cli.tools.file:ReadFile"
    - "kimi_cli.tools.file:Grep"
    - "kimi_cli.tools.file:Glob"
    - "kimi_cli.tools.file:StrReplaceFile"
    - "kimi_cli.tools.file:WriteFile"
    - "kimi_cli.tools.shell:Shell"
