version: 1
agent:
  name: nas-cycle-integrator
  description: Integrates palace_query and routing.yaml into the Hermes main supervisor cycle. Wires config-driven routing and memory lookups into hermes_cycle.py.
  model: inherit
  system_prompt_path: ./nas-cycle-integrator.md
  tools:
    - "kimi_cli.tools.file:ReadFile"
    - "kimi_cli.tools.file:Grep"
    - "kimi_cli.tools.file:Glob"
    - "kimi_cli.tools.file:StrReplaceFile"
    - "kimi_cli.tools.file:WriteFile"
    - "kimi_cli.tools.shell:Shell"
