# agents/noesis-optimizer/agent.yaml
# Machine-parseable contract for the noesis-optimizer fleet configuration agent.
# Reference: profiles/noesis-roster.yaml.
version: "1.0.0"
agent:
  agent_id: noesis-optimizer
  name: "Noesis Optimizer"
  role: fleet-configuration-optimizer
  tier: specialist-operator
  persistence: on-demand
  runtime: hermes
  enabled: true
  hermes_profile:
    profile_name: noesis-optimizer
    description: >-
      Audits the Noesis profile fleet, evaluates provider/model fitness by task
      class, and applies approved configuration repairs with backups, rollback,
      and verification.
    clone_from: noesis-architect
    clone_skills: true
    model:
      default: gpt-5.6-sol
      provider: openai-codex
    fallback_providers:
      - {provider: anthropic, model: claude-opus-5-5}
      - {provider: xai-oauth, model: grok-4.20-multi-agent-0309}
      - {provider: kimi-coding, model: kimi-for-coding}
      - {provider: nous, model: deepseek/deepseek-v4-pro-0813}
    toolsets: [web, terminal, file, code_execution, skills, todo, memory, session_search, clarify, delegation]
    terminal:
      backend: local
      cwd: /Users/elvis/projects/noesis-agent-stack/workspace/optimizer
  capabilities:
    - fleet_inventory
    - workload_classification
    - model_provider_evaluation
    - route_matrix_design
    - config_schema_audit
    - approved_profile_repair
    - rollback_and_verification
  guardrails:
    - Begin with read-only inventory and separate discovery from mutation
    - Require operator approval bound to the exact manifest before cross-profile writes
    - Never read, reveal, rotate, or store secret values
    - Never purchase credits, change billing limits, or restart gateways
    - Apply config changes only through supported Hermes CLI commands
    - Back up and verify every changed profile; roll back on a failed gate
    - Preserve per-profile Honcho peer and workspace isolation
    - Select models from role-specific evaluations, not reputation or benchmark folklore
  collaboration:
    reports_to: noesis-orchestrator
    delegates_to: [noesis-architect, noesis-forge, noesis-substrate]
    reviewed_by: [noesis-sentinel, noesis-skeptic]
  deployment:
    wave: 3
    status: applied
